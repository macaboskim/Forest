<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Moon Switch</title>
    <link rel="preload" as="image" href="image/off.jpg">
    <link rel="preload" as="image" href="image/on.png">
    <link rel="stylesheet" href="activity.css">
</head>
<body>
    <main class="scene" id="scene">
        <div class="stage" id="stage">
            <img id="imgOff" class="bg bg-off" src="image/off.jpg" alt="A peaceful magical forest at night with fireflies and glowing mushrooms" draggable="false">
            <img id="imgOn" class="bg bg-on" src="image/on.png" alt="A dark haunted forest with a graveyard and thick fog" draggable="false">

            <div class="fog fog-a" aria-hidden="true"></div>
            <div class="fog fog-b" aria-hidden="true"></div>
            <div class="fireflies" aria-hidden="true">
                <span class="firefly firefly-a"></span>
                <span class="firefly firefly-b"></span>
                <span class="firefly firefly-c"></span>
                <span class="firefly firefly-d"></span>
                <span class="firefly firefly-e"></span>
                <span class="firefly firefly-f"></span>
            </div>

            <button type="button" class="moon" id="moon" aria-pressed="false" aria-label="Moon: click to reveal the haunted forest" title="Click the moon">
                <span class="moon-rays" aria-hidden="true"></span>
                <span class="moon-aura" aria-hidden="true"></span>
                <span class="moon-shock" aria-hidden="true"></span>
                <span class="moon-shock moon-shock-2" aria-hidden="true"></span>
                <span class="moon-ripple" aria-hidden="true"></span>
                <span class="moon-ripple moon-ripple-2" aria-hidden="true"></span>
                <span class="moon-hint" aria-hidden="true"></span>
            </button>
        </div>

        <canvas class="fx" id="fx" aria-hidden="true"></canvas>
        <div class="cursor-light" aria-hidden="true"></div>
        <div class="lightning" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>
        <div class="grain" aria-hidden="true"></div>
        <div class="flash" aria-hidden="true"></div>
        <div class="bar bar-top" aria-hidden="true"></div>
        <div class="bar bar-bottom" aria-hidden="true"></div>
    </main>

    <script src="activity.js"></script>
</body>
</html>
